# Kailo CI — one job per package, because they are not the same shape.
#
# Both run: npm ci → type-check → audit → production build. Two deliberate
# asymmetries, both explained at the step that carries them:
#
#   • only the frontend runs ESLint — kalio-backend has no ESLint setup at all
#     (no config file, no lint script), so there is nothing to run;
#   • the audit gates are set at different severities, because the two packages
#     are in genuinely different states. See the audit steps.
#
# Neither build needs secrets or a database: `vite build` falls back to the
# committed CMS snapshot when VITE_STRAPI_URL is unset, and `strapi build` only
# compiles TypeScript and the admin panel. Both were verified building from a
# clean checkout with no .env present.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: kalio-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalio-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches kalio-backend/.nvmrc and the engines field there. Keeping both
          # packages on one major avoids a lockfile resolved under a Node the
          # other half of the repo never runs.
          node-version: '22'
          cache: npm
          cache-dependency-path: kalio-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # --max-warnings=0 would fail today: cart.tsx carries one known
      # react-refresh/only-export-components warning, which is a dev-server HMR
      # hint and not a defect. Errors block; that warning does not.
      - name: Lint
        run: npx eslint .

      # Blocking, and it should stay blocking: this package is at zero
      # vulnerabilities of any severity as of the D1 fix, so anything reaching
      # `high` here is new and actionable rather than inherited.
      - name: Audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

  backend:
    name: kalio-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalio-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kalio-backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # No ESLint step: kalio-backend has no ESLint config and no lint script.
      # Adding one is worth doing; inventing a config here in CI is not.

      # Gated at `critical`, not `high`, and that is the whole point of this step.
      #
      # This package carries 33 transitive vulnerabilities from @strapi/strapi
      # 5.51.0 — 4 high, 24 moderate, 5 low — and they have no forward fix today:
      # `npm audit fix` proposes @strapi/strapi 5.36.0, a *downgrade* of fifteen
      # minor versions. Gating at `high` would paint this pipeline permanently red
      # and train everyone to ignore it, which is worse than not checking.
      #
      # Critical is currently zero, so this gate is meaningful right now: it fails
      # on a genuinely new critical while staying quiet about the inherited set.
      # Re-gate to `high` once a Strapi patch release clears them — see
      # docs/backup-recovery.md, "Dependency posture".
      - name: Audit (blocking — critical only)
        run: npm audit --audit-level=critical

      # The inherited set, kept visible rather than hidden. Non-blocking on
      # purpose; read it to notice the count moving, not to gate the merge.
      - name: Audit report (non-blocking — known Strapi transitives)
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
